name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            pymupdf: 'PyMuPDF==1.26.7'
          - os: windows-latest
            python: '3.13'
            pymupdf: 'PyMuPDF>=1.26.7,<1.29'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt "${{ matrix.pymupdf }}"
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_demo.py
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python scripts/render_pdf_pages.py --manifest tmp/demo/manifest.json --render-root tmp/renders
          python scripts/qa_rendered_pages.py --manifest tmp/demo/manifest.json --render-root tmp/renders --report tmp/pixel-report.json
